<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J & M — Our Sacred Realm</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: #050212;
      color: #ffffff;
    }

    /* --- Outer Viewport Container --- */
    .realm-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* --- Splitting Gate Doors using your Drive Image --- */
    .gate-door {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background-image: url('https://lh3.googleusercontent.com/d/1hShirb8fl51RN1IlX493-9HAaq760vCw');
      background-size: 100vw 100vh; /* Scaled to span full screen seamlessly across both halves */
      background-repeat: no-repeat;
      transition: transform 2.8s cubic-bezier(0.7, 0, 0.2, 1), filter 2.5s ease;
      z-index: 5;
    }

    .gate-left {
      left: 0;
      background-position: left center;
    }

    .gate-right {
      right: 0;
      background-position: right center;
    }

    /* Opening Animation States */
    .gate-door.open-left {
      transform: translateX(-100%) scale(1.1);
      filter: brightness(2) drop-shadow(0 0 50px #ffffff);
    }

    .gate-door.open-right {
      transform: translateX(100%) scale(1.1);
      filter: brightness(2) drop-shadow(0 0 50px #ffffff);
    }

    /* --- Center J & M Emblem / Seal --- */
    .center-seal {
      position: relative;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sigil-ring {
      width: 260px;
      height: 260px;
      border: 2px dashed rgba(216, 180, 254, 0.7);
      border-radius: 50%;
      position: absolute;
      animation: rotateSigil 25s linear infinite;
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.7), inset 0 0 20px rgba(192, 132, 252, 0.4);
    }

    @keyframes rotateSigil {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .initials {
      font-family: 'Cinzel', serif;
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 8px;
      color: #f3e8ff;
      text-shadow: 0 0 20px rgba(192, 132, 252, 0.9), 0 0 40px rgba(168, 85, 247, 0.8), 0 0 60px rgba(147, 51, 234, 0.6);
      margin-top: 10px;
    }

    .subtitle {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      letter-spacing: 5px;
      color: #d8b4fe;
      text-transform: uppercase;
      margin-top: 5px;
      margin-bottom: 25px;
      text-shadow: 0 0 10px rgba(192, 132, 252, 0.8);
    }

    .enter-btn {
      font-family: 'Cinzel', serif;
      background: rgba(15, 7, 32, 0.75);
      color: #f3e8ff;
      border: 1px solid #c084fc;
      padding: 12px 32px;
      font-size: 0.95rem;
      letter-spacing: 3px;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 25px rgba(192, 132, 252, 0.6);
      transition: all 0.4s ease;
    }

    .enter-btn:hover {
      background: rgba(192, 132, 252, 0.9);
      color: #0d041a;
      box-shadow: 0 0 40px rgba(192, 132, 252, 1);
      transform: scale(1.06);
    }

    /* --- Genshin Impact Style Full White Flash Transition --- */
    .genshin-flash {
      position: fixed;
      top: 0; 
      left: 0;
      width: 100vw; 
      height: 100vh;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 1.4s ease-in-out;
    }

    .genshin-flash.active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="realm-wrapper">
    
    <!-- Left & Right Gate Doors (Image Background) -->
    <div class="gate-door gate-left" id="gateLeft"></div>
    <div class="gate-door gate-right" id="gateRight"></div>

    <!-- Glowing Center Seal & Button -->
    <div class="center-seal" id="centerSeal">
      <div class="sigil-ring"></div>
      <div class="initials">J & M</div>
      <p class="subtitle">Enter Our Realm</p>
      <button class="enter-btn" onclick="openGates()">Touch to Enter</button>
    </div>

  </div>

  <!-- White Flash Overlay -->
  <div class="genshin-flash" id="genshinFlash"></div>

  <script>
    function openGates() {
      const gateLeft = document.getElementById('gateLeft');
      const gateRight = document.getElementById('gateRight');
      const centerSeal = document.getElementById('centerSeal');
      const genshinFlash = document.getElementById('genshinFlash');

      // 1. Shrink & fade out center seal
      centerSeal.style.opacity = '0';
      centerSeal.style.transform = 'scale(0.7)';
      centerSeal.style.pointerEvents = 'none';

      // 2. Part the doors outward
      setTimeout(() => {
        gateLeft.classList.add('open-left');
        gateRight.classList.add('open-right');
      }, 300);

      // 3. Genshin Impact white light flash transition
      setTimeout(() => {
        genshinFlash.classList.add('active');
      }, 1600);

      // 4. Action after transition completes
      setTimeout(() => {
        alert("Welcome to your world, J & M!");
        // window.location.href = "vows.html"; // Redirect to your next subpage!
      }, 3000);
    }
  </script>
</body>
</html>
